    - word: "nestenna"
      variants: ["نستنا", "نستناو", "نستنى", "انتظر", "في الانتظار"]
    - word: "bzaf"
      variants: ["بزاف", "bzaf", "beaucoup", "كثير"]
    - word: "riglo"
      variants: ["ريقلو", "ريڨلو", "ريقلونا", "régler", "يسقّم"]

  # ============================================================
  # 9. ATTENTES ET TECHNIQUE
  # ============================================================
  technical_and_expectations:
