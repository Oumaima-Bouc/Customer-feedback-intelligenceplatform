  # ============================================================
  # 2. CONNECTIVITÉ ET DÉBIT
  # ============================================================
  connectivity_and_speed:
    - word: "debit"
      variants: ["débit", "debit", "تدفق", "سرعة التدفق", "الصبيب", "speed", "سرعة", "vitesse", "diibi"]
    - word: "mega_giga"
      variants: ["ميغا", "ميقا", "mega", "Mega", "جيغا", "جيقا", "giga", "Go", "GB", "Mbps"]
    - word: "connexion"
      variants: ["connexion", "connection", "كونيكسيو", "كونكسيون", "cnx", "الكونيكسيو", "النت"]
    - word: "download"
      variants: ["download", "téléchargement", "تحميل", "تنزيل", "داونلود"]
    - word: "upload"
      variants: ["upload", "رفع", "ابلود", "l'upload"]
    - word: "ping_latence"
      variants: ["ping", "بينغ", "latence", "latency", "تأخر", "jitter", "packet loss"]

  # ============================================================
  # 3. PROBLÈMES ET PANNES
  # ============================================================
  issues_and_complaints:
    - word: "panne"
      variants: ["panne", "عطل", "عطب", "خلل", "bug", "معطل", "hors service"]
    - word: "coupure"
