    - word: "idoom"
      variants: ["idoom", "ايدوم", "ايدووم", "idoum", "idome", "idoom fibre", "idoom 4g"]
    - word: "4g_lte"
      variants: ["4G", "4g", "4جي", "4G LTE", "4g lte", "LTE", "مودام شريحة"]
    - word: "my_idoom"
      variants: ["My Idoom", "my idoom", "ماي ايدوم", "تطبيق ايدوم", "Application My Idoom"]
    - word: "espace_client"
      variants: ["فضاء الزبون", "espace client", "Espace Client", "espace-client", "فضاء الزبائن"]
    - word: "iptv"
      variants: ["IPTV", "iptv", "بث مباشر", "قنوات", "streaming", "VOD", "TOD", "bein sport"]
    - word: "telephone_fixe"
      variants: ["هاتف ثابت", "الهاتف الثابت", "تلفون ثابت", "خط ثابت", "le fixe", "téléphone fixe", "فيكس"]
    - word: "operators"
